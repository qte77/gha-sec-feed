---
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'docs/**', '*.md']
  pull_request:
    paths-ignore: ['data/**', 'docs/**', '*.md']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - run: make install
      - run: make validate
...
