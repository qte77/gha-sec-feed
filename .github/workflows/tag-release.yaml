---
name: tag-release
on:
  push:
    branches: [main]
    paths: ['pyproject.toml']

permissions: {}

jobs:
  tag:
    name: tag + release on version bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Tag and release if [project].version changed
        run: |
          set -euo pipefail
          new=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          prev=$(git show HEAD^:pyproject.toml 2>/dev/null \
            | grep -m1 '^version = ' | sed -E 's/version = "(.*)"/\1/' || echo "")
          if [[ "$new" == "$prev" ]]; then
            echo "version unchanged ($new); nothing to tag"
            exit 0
          fi
          tag="v$new"
          if gh api "repos/${{ github.repository }}/git/refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists; skipping"
            exit 0
          fi
          # `gh release create` creates the tag (at the web-flow-signed squash
          # commit now on main) and the GitHub Release with autogenerated notes.
          gh release create "$tag" --target "$(git rev-parse HEAD)" \
            --title "$tag" --generate-notes
