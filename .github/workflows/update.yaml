---
name: Update feed
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: 'pubStartDate override (ISO-8601 Z UTC, default: 8 days ago)'
        required: false
        type: string

permissions: {}

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    name: fetch + commit + auto-merge PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - run: make install

      - name: Run producer
        env:
          SINCE_OVERRIDE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          since="${SINCE_OVERRIDE:-$(date -u -d '8 days ago' +%FT%TZ)}"
          echo "Fetching since: $since"
          uv run python -m gha_sec_feed --out data --since "$since"

      - name: Open auto-merged PR if data changed
        run: |
          set -euo pipefail
          # `git diff --quiet` only flags MODIFIED tracked files. Use
          # `git status --porcelain` so newly-written files (the
          # common case on a fresh `data/`) are detected too.
          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "no changes to data/, nothing to do"
            exit 0
          fi
          branch="auto-update-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/
          git commit -m "chore(data): scheduled feed refresh"
          git push -u origin "$branch"
          gh pr create \
            --title "chore(data): scheduled feed refresh" \
            --body "Auto-generated by .github/workflows/update.yaml. Squash-merges automatically once CI is green." \
            --base main \
            --head "$branch"
          gh pr merge "$branch" --squash --auto --delete-branch
...
