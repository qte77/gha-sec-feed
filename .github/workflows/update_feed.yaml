---
name: update_feed
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: 'pubStartDate override, ISO-8601 Z UTC (e.g., 2026-05-27T00:00:00Z). Default: 8 days ago.'
        required: false
        type: string
      keywords:
        description: 'CSV keyword filter (id + description, case-insensitive). Empty = no keyword filter.'
        required: false
        type: string
        default: ''
      severity_min:
        description: 'Minimum severity (critical/high/medium/low/unknown). unknown = no severity filter.'
        required: false
        type: string
        default: 'unknown'
      kev_only:
        description: 'If true, keep only KEV-flagged rows.'
        required: false
        type: boolean
        default: false
      cwe_include:
        description: 'CSV CWE identifiers (intersected with each row''s cwes). Empty = no CWE filter.'
        required: false
        type: string
        default: ''
      vendor_include:
        description: 'CSV vendor names (CPE-derived or inferred from GitHub-org refs), intersected with each row''s vendors. Default is the qte77-stack showcase set. KEV rows have empty vendors and are rejected when set.'
        required: false
        type: string
        default: 'python,nodejs,docker,kubernetes,fastapi,pydantic,django,helm,rust-lang,github'
      out_dir:
        description: 'Output directory for feed.jsonl + feed-meta.json.'
        required: false
        type: string
        default: 'data'
  workflow_call:
    inputs:
      since:
        description: 'pubStartDate override, ISO-8601 Z UTC (e.g., 2026-05-27T00:00:00Z). Default: 8 days ago.'
        required: false
        type: string
      keywords:
        description: 'CSV keyword filter. Empty = no filter (downstream-caller default).'
        required: false
        type: string
        default: ''
      severity_min:
        description: 'Minimum severity (critical/high/medium/low/unknown).'
        required: false
        type: string
        default: 'unknown'
      kev_only:
        description: 'If true, keep only KEV-flagged rows.'
        required: false
        type: boolean
        default: false
      cwe_include:
        description: 'CSV CWE identifiers. Empty = no filter.'
        required: false
        type: string
        default: ''
      vendor_include:
        description: 'CSV CPE-derived vendor names. Empty = no filter. KEV rows rejected when set.'
        required: false
        type: string
        default: ''
      out_dir:
        description: 'Output directory for feed.jsonl + feed-meta.json.'
        required: false
        type: string
        default: 'data'

permissions: {}

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    name: fetch + commit + auto-merge PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Authenticates the producer's GHSA fetch (api.github.com): 60->1000/hr.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Filter knobs flow into pydantic-settings env vars on the producer.
      # Empty strings are treated as "no filter" by the producer's CSV parser.
      GSF_KEYWORDS: ${{ inputs.keywords }}
      GSF_SEVERITY_MIN: ${{ inputs.severity_min || 'unknown' }}
      GSF_KEV_ONLY: ${{ inputs.kev_only && 'true' || 'false' }}
      GSF_CWE_INCLUDE: ${{ inputs.cwe_include }}
      # This repo's own weekly cron showcases the filter with a qte77-stack
      # vendor allowlist (CPE-derived or inferred from GitHub-org refs — more
      # precise than bare keywords). Gated on `github.repository` so downstream
      # reusable-workflow callers running on their own schedule get their own
      # `vendor_include`, not ours. `schedule` carries no `inputs.*`.
      GSF_VENDOR_INCLUDE: >-
        ${{ (github.event_name == 'schedule' && github.repository == 'qte77/gha-sec-feed')
            && 'python,nodejs,docker,kubernetes,fastapi,pydantic,django,helm,rust-lang,github'
            || inputs.vendor_include }}
      GSF_OUT_DIR: ${{ inputs.out_dir || 'data' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: make install

      - name: Run producer
        env:
          SINCE_OVERRIDE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          # `since` is in ISO-Z form. NVD CVE API v2 accepts that
          # form despite their docs claiming `.000` is required (#27).
          since="${SINCE_OVERRIDE:-$(date -u -d '7 days ago' +%FT%TZ)}"
          echo "Fetching since: $since"
          echo "Filters: severity_min=$GSF_SEVERITY_MIN, kev_only=$GSF_KEV_ONLY, cwe_include=${GSF_CWE_INCLUDE:-(empty)}, vendor_include=${GSF_VENDOR_INCLUDE:-(empty)}, keywords=${GSF_KEYWORDS:-(empty)}"
          uv run python -m gha_sec_feed --out "$GSF_OUT_DIR" --since "$since"

      - name: Open auto-merged PR if data changed
        run: |
          set -euo pipefail
          # `git diff --quiet` only flags MODIFIED tracked files. Use
          # `git status --porcelain` so newly-written files (the
          # common case on a fresh out dir) are detected too.
          if [[ -z "$(git status --porcelain "$GSF_OUT_DIR/")" ]]; then
            echo "no changes to $GSF_OUT_DIR/, nothing to do"
            exit 0
          fi

          # Commit via the Git Data API rather than a runner-side `git
          # commit`: server-created commits are web-flow signed, satisfying
          # the branch ruleset's `required_signatures` rule. A runner
          # `git commit` is unsigned and makes the auto-PR unmergeable under
          # GraphQL (#45). File contents are inlined into the tree via jq
          # --rawfile (read from disk, not shell args) so a large feed.jsonl
          # doesn't blow ARG_MAX; the tree JSON streams to gh api over stdin
          # and GitHub creates the blobs.
          repo="${{ github.repository }}"
          base_sha=$(gh api "repos/$repo/git/refs/heads/main" --jq '.object.sha')
          base_tree=$(gh api "repos/$repo/git/commits/$base_sha" --jq '.tree.sha')

          tree_sha=$(jq -n \
            --arg base "$base_tree" \
            --arg p1 "$GSF_OUT_DIR/feed.jsonl"     --rawfile c1 "$GSF_OUT_DIR/feed.jsonl" \
            --arg p2 "$GSF_OUT_DIR/feed-meta.json" --rawfile c2 "$GSF_OUT_DIR/feed-meta.json" \
            '{base_tree:$base, tree:[
               {path:$p1, mode:"100644", type:"blob", content:$c1},
               {path:$p2, mode:"100644", type:"blob", content:$c2}]}' \
            | gh api -X POST "repos/$repo/git/trees" --input - --jq '.sha')

          commit_sha=$(jq -n \
            --arg msg "chore(data): feed refresh" \
            --arg tree "$tree_sha" --arg parent "$base_sha" \
            '{message:$msg, tree:$tree, parents:[$parent]}' \
            | gh api -X POST "repos/$repo/git/commits" --input - --jq '.sha')

          branch="auto-update-$(date -u +%Y%m%d-%H%M%S)"
          gh api -X POST "repos/$repo/git/refs" \
            -f ref="refs/heads/$branch" -f sha="$commit_sha"

          # CodeFactor is the only required status check; CodeQL is advisory,
          # so no force-dispatch is needed. The server-signed commit lets the
          # GraphQL auto-merge resolve once CodeFactor is green.
          gh pr create \
            --title "chore(data): feed refresh" \
            --body "Auto-generated by .github/workflows/update_feed.yaml. The commit is created server-side via the Git Data API, so it is web-flow signed and satisfies required_signatures. Squash-merges automatically once checks are green." \
            --base main \
            --head "$branch"
          gh pr merge "$branch" --squash --auto --delete-branch
...
