---
name: update_feed
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: 'pubStartDate override, ISO-8601 Z UTC (e.g., 2026-05-27T00:00:00Z). Default: 8 days ago.'
        required: false
        type: string
      keywords:
        description: 'CSV keyword filter (id + description, case-insensitive). Default is the qte77-stack showcase set.'
        required: false
        type: string
        default: 'github,python,docker,npm,rust,pip,pypi,node,typescript,cargo,uv,httpx,pydantic,markdown,codeql'
      severity_min:
        description: 'Minimum severity (critical/high/medium/low/unknown). unknown = no severity filter.'
        required: false
        type: string
        default: 'unknown'
      kev_only:
        description: 'If true, keep only KEV-flagged rows.'
        required: false
        type: boolean
        default: false
      cwe_include:
        description: 'CSV CWE identifiers (intersected with each row''s cwes). Empty = no CWE filter.'
        required: false
        type: string
        default: ''
      out_dir:
        description: 'Output directory for feed.jsonl + feed-meta.json.'
        required: false
        type: string
        default: 'data'
  workflow_call:
    inputs:
      since:
        description: 'pubStartDate override, ISO-8601 Z UTC (e.g., 2026-05-27T00:00:00Z). Default: 8 days ago.'
        required: false
        type: string
      keywords:
        description: 'CSV keyword filter. Empty = no filter (downstream-caller default).'
        required: false
        type: string
        default: ''
      severity_min:
        description: 'Minimum severity (critical/high/medium/low/unknown).'
        required: false
        type: string
        default: 'unknown'
      kev_only:
        description: 'If true, keep only KEV-flagged rows.'
        required: false
        type: boolean
        default: false
      cwe_include:
        description: 'CSV CWE identifiers. Empty = no filter.'
        required: false
        type: string
        default: ''
      out_dir:
        description: 'Output directory for feed.jsonl + feed-meta.json.'
        required: false
        type: string
        default: 'data'

permissions: {}

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    name: fetch + commit + auto-merge PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Filter knobs flow into pydantic-settings env vars on the producer.
      # `schedule` has no `inputs.*`, so fall back to the showcase set
      # there; otherwise pass the resolved input through verbatim. Empty
      # strings are treated as "no filter" by the producer's CSV parser.
      GSF_KEYWORDS: >-
        ${{ github.event_name == 'schedule'
            && 'github,python,docker,npm,rust,pip,pypi,node,typescript,cargo,uv,httpx,pydantic,markdown,codeql'
            || inputs.keywords }}
      GSF_SEVERITY_MIN: ${{ inputs.severity_min || 'unknown' }}
      GSF_KEV_ONLY: ${{ inputs.kev_only && 'true' || 'false' }}
      GSF_CWE_INCLUDE: ${{ inputs.cwe_include }}
      GSF_OUT_DIR: ${{ inputs.out_dir || 'data' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - run: make install

      - name: Run producer
        env:
          SINCE_OVERRIDE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          # `since` is in ISO-Z form here; the NVD fetcher reformats
          # internally to the millisecond form NVD's API requires (#27).
          since="${SINCE_OVERRIDE:-$(date -u -d '8 days ago' +%FT%TZ)}"
          echo "Fetching since: $since"
          echo "Filters: severity_min=$GSF_SEVERITY_MIN, kev_only=$GSF_KEV_ONLY, cwe_include=${GSF_CWE_INCLUDE:-(empty)}, keywords=${GSF_KEYWORDS:-(empty)}"
          uv run python -m gha_sec_feed --out "$GSF_OUT_DIR" --since "$since"

      - name: Open auto-merged PR if data changed
        run: |
          set -euo pipefail
          # `git diff --quiet` only flags MODIFIED tracked files. Use
          # `git status --porcelain` so newly-written files (the
          # common case on a fresh out dir) are detected too.
          if [[ -z "$(git status --porcelain "$GSF_OUT_DIR/")" ]]; then
            echo "no changes to $GSF_OUT_DIR/, nothing to do"
            exit 0
          fi
          branch="auto-update-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$GSF_OUT_DIR/"
          git commit -m "chore(data): scheduled feed refresh"
          git push -u origin "$branch"
          gh pr create \
            --title "chore(data): scheduled feed refresh" \
            --body "Auto-generated by .github/workflows/update_feed.yaml. Squash-merges automatically once CI is green." \
            --base main \
            --head "$branch"
          gh pr merge "$branch" --squash --auto --delete-branch
...
