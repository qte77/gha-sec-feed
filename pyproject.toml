[project]
name = "gha-sec-feed"
version = "0.1.0"
description = "Producer that fetches NVD + CISA KEV vulnerability data and emits JSONL via the C1 contract."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pyright>=1.1",
  "ruff>=0.5",
  "hypothesis>=6",
  "bump-my-version>=0.29",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gha_sec_feed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q --cov=src/gha_sec_feed"
# Coverage threshold is enforced by CI (`uv run pytest --cov-fail-under=70`),
# not locally — local `make test` should not fail just because a new test
# file is being driven through Red-Green-Refactor.

# Atomic version bumping. [project].version is the single source of truth;
# bump-my-version bumps + commits both it and __version__. Tagging is deferred
# to tag-release.yaml so the tag lands on main's squash-merge commit.
# CHANGELOG.md is hand-edited (Keep a Changelog) — no scriv.
[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = false
allow_dirty = false
message = "chore(release): bump {current_version} -> {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/gha_sec_feed/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# D: docstrings for module/class/function/package so consumers can read the C1 surface.
# S: bandit-equivalent security checks (relevant for HTTP allowlist + URL parsing).
# C90: McCabe complexity ≤ 10.
select = ["D100", "D101", "D103", "D104", "S", "C90"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests don't need docstrings; assert is the point in tests.
"tests/**" = ["D", "S101"]
